services:
  - type: web
    name: ner-smart-logistics-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: ner-smart-logistics-frontend
    runtime: static
    buildCommand: echo "Static frontend ready"
    staticPublishPath: .
